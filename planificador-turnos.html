<title>Planificador de Turnos PeYA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: barra de marca Zubale × PedidosYa arriba; one working column (max 1180px); views swap in place — resumen → tablero de semana → editor de tienda. */
:root{
  /* Zubale: azul #0A4CF3 · PedidosYa: rojo #D93252 · solo tema claro */
  --bg:#F4F6FC; --surface:#FFFFFF; --sunk:#EEF2FC; --ink:#0D1A3D; --muted:#5A6688; --line:#DCE3F3;
  --accent:#0A4CF3; --accent-ink:#FFFFFF; --focus:#0A4CF3; --peya:#D93252;
  --am-bg:#E3EBFF; --am-fg:#0A3FC8; --pm-bg:#E8E4FF; --pm-fg:#4630B0; --pt-bg:#DDF4EF; --pt-fg:#0D6B5E;
  --off-bg:#EEF1F7; --off-fg:#6D7894; --ret-bg:#FBE1E7; --ret-fg:#B0213F;
  --rev-bg:#FFF1BF; --rev-fg:#6E5200; --rev-line:#EBC94E; --ok-bg:#D9F3E1; --ok-fg:#146237; --ok-line:#7FCF9B;
  --warn:#9B5B00;
  --f-display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Lexend", "Segoe UI", system-ui, sans-serif;
  --r:12px; color-scheme:light;
}

.brandbar{max-width:1180px;margin:0 auto 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;box-shadow:0 1px 0 rgba(13,26,61,.04);border-top:3px solid var(--accent)}
.brandbar img{height:36px;width:auto;max-width:100%;display:block}
.brandbar .app{display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.brandbar .app b{font-weight:600;font-size:.95rem}
.brandbar .app span{font-size:.78rem;color:var(--muted)}
@media (max-width:640px){ .brandbar .app{align-items:flex-start;text-align:left} .brandbar img{height:30px} }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body);font-weight:400;font-variant-numeric:tabular-nums;padding-inline:16px;padding-block:20px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.8rem;font-weight:600;line-height:1.15}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600;font-family:var(--f-body);letter-spacing:0}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.topbar .titles{display:flex;flex-direction:column;gap:4px;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.topbar .actions{align-items:flex-end}
.topbar .actions .btn,.topbar .actions select{height:38px;padding-block:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;line-height:1.2;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--ret-fg)}
.btn.dangerfill{background:var(--ret-fg);border-color:var(--ret-fg);color:#FFFFFF}
.confirmbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:var(--r);border:1px solid var(--rev-line);background:var(--rev-bg);color:var(--ink)}
.confirmbar.clear{border-color:var(--ret-fg);background:var(--ret-bg)}
.confirmbar span{flex:1;min-width:240px;max-width:75ch}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
select,input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.55rem;font-weight:600;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.k-am{background:var(--am-bg);color:var(--am-fg)} .k-pm{background:var(--pm-bg);color:var(--pm-fg)}
.k-pt{background:var(--pt-bg);color:var(--pt-fg)} .k-off{background:var(--off-bg);color:var(--off-fg)}
.k-ret{background:var(--ret-bg);color:var(--ret-fg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.store{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.store:hover{border-color:var(--accent)}
.store .row1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.store .row1 .pill{flex:none;font-size:.72rem;padding:2px 8px}
.weekstatus{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-block:2px 4px}
.store .name{font-weight:600;line-height:1.25}
.chain{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--peya);font-weight:600}
.store .meta{display:flex;gap:14px;font-size:.84rem;color:var(--muted)}
.store .meta b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:58px}
.bar{display:flex;flex-direction:column-reverse;gap:1px;height:100%;justify-content:flex-start}
.bar span{display:block;border-radius:2px}
.bar .s-am{background:var(--accent)} .bar .s-pm{background:var(--pm-fg);opacity:.8} .bar .s-pt{background:var(--pt-fg);opacity:.7}
.barlabels{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:.68rem;color:var(--muted);text-align:center;margin-top:-6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tfoot td{background:var(--sunk);font-size:.8rem;color:var(--muted);border-bottom:none;border-top:1px solid var(--line)}
td.person{min-width:210px}
td.person .pn{font-weight:500;line-height:1.25}
td.person .pm{font-size:.78rem;color:var(--muted)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.8rem;padding:3px 7px;border-radius:5px;white-space:nowrap;line-height:1.3}
.chip.k-off{font-family:var(--f-body);font-size:.72rem;letter-spacing:.05em;font-weight:600}
.chip.k-ret{font-family:var(--f-body);font-size:.72rem;letter-spacing:.05em;font-weight:600}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.rev{background:var(--rev-bg);color:var(--rev-fg);border-color:var(--rev-line)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-line)}
.pill.draft{background:transparent;color:var(--warn);border-color:var(--warn);border-style:dashed}
.pill.draft::before{display:none}

.progress{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1}
.track{height:8px;border-radius:99px;background:var(--rev-bg);overflow:hidden;border:1px solid var(--rev-line)}
.track span{display:block;height:100%;background:var(--ok-fg);opacity:.8}

.weekpick{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.weekpick select{font-size:1.05rem;font-weight:600;padding:8px 12px}

/* editor */
.ed td{padding:5px 6px}
.ed select.cell,.ed input.cell{width:100%;min-width:112px;font-family:var(--f-mono);font-size:.82rem;padding:5px 6px;border-radius:6px;border:1px solid transparent}
.ed .cell.k-am,.ed .cell.k-pm,.ed .cell.k-pt,.ed .cell.k-off,.ed .cell.k-ret{border-color:transparent}
.ed .cellwrap{position:relative}
.ed .cellwrap.manual::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ed .cellwrap.changed .cell{outline:2px solid var(--accent);outline-offset:-2px}
.ed input.nm{width:100%;min-width:240px;font-weight:500;padding:5px 8px}
.ed .sub{display:flex;gap:4px;margin-top:4px}
.ed .sub select{font-size:.76rem;padding:3px 4px}
.ed input.tipo{width:150px;font-size:.84rem;padding:5px 8px}
.ed select.desc{font-size:.84rem;padding:5px 6px;width:118px}
.hrs{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.hrs.over{color:var(--ret-fg);font-weight:600}
.cov{font-family:var(--f-mono);font-size:.76rem;white-space:nowrap;line-height:1.35}
.cov .zero{color:var(--ret-fg);font-weight:600}
.addrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:12px;background:var(--sunk);border-radius:8px}
.addrow .field input,.addrow .field select{min-width:120px}
.addrow .field.grow{flex:1;min-width:200px}
.addrow .field.grow input{width:100%}
.notes{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.notes ul{margin:0;padding-left:18px}
.rules{font-size:.86rem;color:var(--muted);max-width:75ch}
.rules summary{cursor:pointer;color:var(--ink);font-weight:500}
.rules ul{margin:.4em 0 0;padding-left:18px}
.confirm{display:inline-flex;gap:4px;align-items:center;font-size:.82rem}

.banner{font-size:.85rem;padding:8px 12px;border-radius:8px;background:var(--sunk);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#FFFFFF;padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2);z-index:50}

.overlay{position:fixed;inset:0;background:rgba(10,18,24,.45);display:flex;justify-content:center;align-items:flex-start;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:40}
.overlay .panel{width:100%;max-width:1040px}

.storeTable td:first-child{font-weight:500}
.storeTable tr.click{cursor:pointer}
.storeTable tr.click:hover td{background:var(--sunk)}

@media (max-width:640px){ h1{font-size:1.5rem} .stat b{font-size:1.3rem} .hide-sm{display:none} }
@media (prefers-reduced-motion:no-preference){ .ed .cellwrap.changed .cell{transition:outline-color .6s} }
</style>

function coverage(people){ return DAYS.map((_,i)=>{ const c={am:0,pm:0,pt:0}; people.forEach(p=>{ const k=kind(p.days[i]); if(c[k]!==undefined) c[k]++; }); return c; }); }

let plans={}; let storage='cargando'; let db=null, downloads=null;
const drafts={}; // key -> {people}
const key=(w,s)=>`w${w}--${slug(s)}`;
const ui={view:'summary', sumWeek:40, planWeek:41, store:null, detail:null, changed:new Set(), notes:null, confirmDel:null, confirmWeek:null};

function effective(w,s){
  const p=plans[key(w,s)]; if(p) return {status:p.status, people:p.people, source:'guardado', updatedAt:p.updatedAt};
  if(w===40) return {status:'excel', people:SHEET[40][s]||[], source:'excel'};
  if(w===41) return {status:'revisar', people:SHEET[41][s]||[], source:'excel'};
  if(w>41) return {status:'revisar', people:carry(prevSource(w,s).e.people), source:'sugerido'};
  return {status:'revisar', people:[], source:'vacío'};
}
const carry=ps=>ps.filter(p=>!retired(p)).map(p=>({...clone(p),manual:[]}));
// semana anterior más cercana que no fue eliminada
function prevSource(w,s){ for(let m=w-1;m>=40;m--){ if(!plans[key(m,s)]?.cleared) return {e:effective(m,s),m}; } return {e:{people:[]},m:w-1}; }
function weekPeople(w){ return STORES.flatMap(s=>effective(w,s).people); }

/* ---------- persistencia ---------- */
const LS='peya-turnos-plans';
function loadLocal(){ try{ plans=JSON.parse(localStorage.getItem(LS)||'{}')||{}; }catch(e){ plans={}; } }
function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify(plans)); }catch(e){} }
async function boot(){
  loadLocal(); storage='local';
  const use=window.claude?.use;
  if(use){
    try{ downloads=await window.claude.use('downloads'); }catch(e){ downloads=null; }
    try{ db=await window.claude.use('db'); }catch(e){ db=null; }
    if(db){
      db.collection('plans').limit(1000).onSnapshot(snap=>{
        const next={}; snap.docs.forEach(d=>{ const x=d.data(); if(x&&x.week&&x.store) next[key(x.week,x.store)]=x; });
        plans=next; storage='db'; if(ui.view!=='editor') render(); else renderEditorStatus();
      }, err=>{ storage='local'; db=null; toast('No se pudo conectar con la base compartida. Los cambios se guardan solo en este navegador.'); render(); });
    }
  }
  render();
}
async function persist(w,s,people){
  return persistBody({week:w, store:s, status:'planificado', people:clone(people), updatedAt:new Date().toISOString()});
}
async function persistBody(body){
  const w=body.week, s=body.store;
  plans[key(w,s)]=body;
  if(db){ try{ await db.doc('plans/'+key(w,s)).set(body); return true; }
    catch(e){ toast(e?.code==='quota_exceeded'?'La base está llena. Elimina semanas antiguas para seguir guardando.':'No se pudo guardar en la base compartida. Quedó guardado en este navegador.'); saveLocal(); return false; } }
  saveLocal(); return true;
}

/* ---------- reglas de "Actualizar" ---------- */
const LETTER={L:0,M:1,MI:2,X:2,J:3,V:4,S:5,D:6};
function tipoPattern(tipo,p){
  const t=(tipo||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim(); const pat=Array(7).fill(null);
  if(!t||t.includes('ROTATIVO')) return pat;
  const amS=typical(p,'am')||'08 - 16', pmS=typical(p,'pm')||'14 - 22';
  if(t.includes('PART')){ if(t.includes('PM')) pat.fill(typical(p,'pt')&&parse(typical(p,'pt')).s>=12?typical(p,'pt'):'18 - 22');
    else if(t.includes('AM')) pat.fill(typical(p,'pt')&&parse(typical(p,'pt')).s<12?typical(p,'pt'):'09 - 13'); return pat; }
  const re=/((?:MI|[LMXJVSD])(?:\s*-\s*(?:MI|[LMXJVSD]))*)\s*\(\s*(AM|PM)\s*\)/g; let m, any=false;
  while((m=re.exec(t))){ any=true; const toks=m[1].split('-').map(x=>LETTER[x.trim()]); let idx=toks;
    if(toks.length===2&&toks[0]<=toks[1]){ idx=[]; for(let i=toks[0];i<=toks[1];i++) idx.push(i); }
    idx.forEach(i=>{ if(i!==undefined) pat[i]=m[2]==='AM'?amS:pmS; }); }
  if(!any){ if(/\bAM\b/.test(t)) pat.fill(amS); else if(/\bPM\b/.test(t)) pat.fill(pmS); }
  return pat;
}
function applyRules(people){
  const changed=new Set(), notes=[];
  people.forEach(p=>{
    if(retired(p)) return;
    const before=p.days.slice(), man=new Set(p.manual||[]);
    if(p.descanso){ const di=DAYS.indexOf(p.descanso);
      if(di>=0 && !man.has(di) && p.days[di]!=='DESCANSO'){
        const fill=typical(p)||'08 - 16'; p.days[di]='DESCANSO';
        p.days.forEach((v,i)=>{ if(i!==di && v==='DESCANSO' && !man.has(i)) p.days[i]=fill; }); } }
    const pat=tipoPattern(p.tipo,p);
    pat.forEach((s,i)=>{ if(s && isWork(p.days[i]) && !man.has(i)) p.days[i]=s; });
    before.forEach((v,i)=>{ if(v!==p.days[i]) changed.add(p.id+':'+i); });
    const h=hoursOf(p); if(h>MAX_H) notes.push(`${p.name}: ${h} h programadas, supera el máximo de ${MAX_H} h semanales.`);
    if(!p.days.some(v=>v==='DESCANSO')) notes.push(`${p.name}: no tiene día de descanso.`);
  });
  coverage(people).forEach((c,i)=>{ if(people.length){ if(!c.am) notes.push(`${DAYS[i]}: nadie en turno AM.`); if(!c.pm) notes.push(`${DAYS[i]}: nadie en turno PM.`); } });
  return {changed,notes};
}

/* ---------- utilidades UI ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chip(v){ const k=kind(v); return `<span class="chip k-${k}">${esc(v||'—')}</span>`; }
function pill(status,dirty){ const base= status==='planificado'?'<span class="pill ok">Planificado</span>': status==='excel'?'<span class="pill ok">Planificado</span>':'<span class="pill rev">Por revisar</span>';
  return base+(dirty?' <span class="pill draft">Cambios sin aplicar</span>':''); }
function chainOf(s){ return s.split(' ')[0]; }
function cityOf(s){ const m=/\(([^)]+)\)/.exec(s); return m?m[1]:'Lima'; }
function toast(msg){ const h=document.getElementById('toastHost'); h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>h.innerHTML='',3800); }
function storageNote(){ return storage==='db'?'Guardado en la base compartida del artifact.':storage==='local'?'Guardado solo en este navegador (la base compartida no está disponible en esta vista).':'Conectando…'; }
function fmtTime(iso){ if(!iso) return '—'; const d=new Date(iso); return `${d.getDate()} ${MES[d.getMonth()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

/* ---------- vistas ---------- */
function render(){ const app=document.getElementById('app');
  if(ui.view==='summary') app.innerHTML=viewSummary();
  else if(ui.view==='plan') app.innerHTML=viewPlan();
  else app.innerHTML=viewEditor();
}

function summaryWeeks(){ return [40,...PLAN_WEEKS]; }

function viewSummary(){
  const w=ui.sumWeek, people=weekPeople(w).filter(p=>!retired(p));
  const hrs=people.reduce((a,p)=>a+hoursOf(p),0), sen=people.filter(p=>/senior/i.test(p.rol)).length;
  const cov=coverage(people); const tot=cov.map(c=>c.am+c.pm+c.pt); const maxDay=Math.max(...tot), peakDay=DAYS[tot.indexOf(maxDay)].toLowerCase();
  const label= w===40?'Semana previa':'Semana';
  const isDone=s=>['planificado','excel'].includes(effective(w,s).status);
  const doneN=STORES.filter(isDone).length, weekDone=doneN===STORES.length;
  const weekPill= weekDone?'<span class="pill ok">Planificado</span>':`<span class="pill rev">Por revisar</span> <span class="muted" style="font-size:.86rem">${doneN} de ${STORES.length} tiendas planificadas · faltan ${STORES.length-doneN}</span>`;
  const cards=STORES.map(s=>{ const ps=effective(w,s).people.filter(p=>!retired(p)); if(!ps.length) return '';
    const c=coverage(ps), mx=Math.max(1,...c.map(x=>x.am+x.pm+x.pt));
    const bars=c.map(x=>`<div class="bar" title="AM ${x.am} · PM ${x.pm} · Part ${x.pt}">${x.am?`<span class="s-am" style="height:${x.am/mx*100}%"></span>`:''}${x.pm?`<span class="s-pm" style="height:${x.pm/mx*100}%"></span>`:''}${x.pt?`<span class="s-pt" style="height:${x.pt/mx*100}%"></span>`:''}</div>`).join('');
    return `<button class="store" data-act="detail" data-store="${esc(s)}">
      <div class="row1"><div><div class="chain">${esc(chainOf(s))} · ${esc(cityOf(s))}</div><div class="name">${esc(s)}</div></div>${pill(effective(w,s).status,!!drafts[key(w,s)])}</div>
      <div class="meta"><span><b>${ps.length}</b> personas</span><span><b>${ps.reduce((a,p)=>a+hoursOf(p),0)}</b> h</span><span><b>${ps.filter(p=>/senior/i.test(p.rol)).length}</b> senior</span></div>

    </button>`; }).join('');

  <header class="topbar">
    <div class="titles"><span class="eyebrow">${label} · S${w} · ${range(w)}</span><h1>Horarios por tienda</h1><div class="weekstatus">${weekPill}</div>
      <span class="muted">Base tomada de “Planificación de horarios PeYA”. Toca una tienda para ver el detalle por persona.</span></div>
    <div class="actions">
      <div class="field"><label for="sumWeek">Ver semana</label><select id="sumWeek">${summaryWeeks().map(x=>`<option value="${x}" ${x===w?'selected':''}>S${x} · ${range(x)}</option>`).join('')}</select></div>
      <button class="btn" data-act="export" data-week="${w}">Exportar Excel S${w}</button>
      <button class="btn" data-act="askWeek" data-type="reset" ${w===40?'disabled title="La S40 es la base del Excel"':''}>Resetear semana</button>
      <button class="btn danger" data-act="askWeek" data-type="clear" ${w===40?'disabled title="La S40 es la base del Excel"':''}>Eliminar semana</button>
      <button class="btn primary" data-act="goPlan">Planificar nueva semana</button>
    </div>
  </header>
  <section class="stats" aria-label="Resumen de la semana">
    <div class="stat"><b>${STORES.filter(s=>effective(w,s).people.some(p=>!retired(p))).length}</b><span>tiendas</span></div>
    <div class="stat"><b>${people.length}</b><span>zubaleros activos</span></div>
    <div class="stat"><b>${sen}</b><span>Picker Senior (ZWORK)</span></div>
    <div class="stat"><b class="num">${hrs.toLocaleString('es-PE')}</b><span>horas programadas</span></div>
    <div class="stat"><b>${maxDay}</b><span>personas el día pico (${peakDay})</span></div>
  </section>
  <div class="legend"><span><i class="k-am"></i>Turno AM</span><span><i class="k-pm"></i>Turno PM</span><span><i class="k-pt"></i>Part time (&lt; 6 h)</span><span><i class="k-off"></i>Descanso</span><span><i class="k-ret"></i>Retiro / vacaciones</span><span>Barras: personas por día (AM abajo, PM arriba)</span></div>
  ${weekConfirm(w)}
  ${cards.trim()?`<section class="grid">${cards}</section>`:`<section class="panel"><h3>La S${w} no tiene horarios</h3><p class="muted" style="margin:0">Usa “Resetear semana” para copiar los horarios de la semana anterior, o entra a “Planificar nueva semana” y agrega personas tienda por tienda.</p></section>`}
  ${ui.detail?detailOverlay(w,ui.detail):''}`;
}

function getDraft(){ const k=key(ui.planWeek,ui.store); if(!drafts[k]) return null; return drafts[k]; }
function ensureDraft(){ const k=key(ui.planWeek,ui.store); if(!drafts[k]) drafts[k]={people:clone(effective(ui.planWeek,ui.store).people)}; return drafts[k]; }
function workingPeople(){ return getDraft()?.people || effective(ui.planWeek,ui.store).people; }

function cellSelect(p,i){
  const v=p.days[i]; const opts=[...new Set([...SHIFT_OPTS, ...(isWork(v)||SPECIAL.includes(v)?[]:[v]), ...(isWork(v)?[v]:[])])].sort();
  const all=[...opts, ...SPECIAL];
  const man=(p.manual||[]).includes(i), ch=ui.changed.has(p.id+':'+i);
  return `<div class="cellwrap ${man?'manual':''} ${ch?'changed':''}"><select class="cell k-${kind(v)}" data-f="day" data-pid="${p.id}" data-i="${i}" id="c-${p.id}-${i}" aria-label="${esc(p.name)} ${DAYS[i]}">
    ${all.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}</option>`).join('')}<option value="__otro">Otro horario…</option></select></div>`;
}

function renderEditorStatus(){ const el=document.getElementById('edStatus'); if(el&&ui.store) el.innerHTML=pill(effective(ui.planWeek,ui.store).status,!!getDraft()); }

/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]'); if(!t) return;
  if(t.dataset.act==='closeDetail' && ev.target.closest('[data-stop]') && t.id!=='closeDetailBtn') return;
  const a=t.dataset.act;
  if(a==='detail'){ ui.detail=t.dataset.store; render(); document.getElementById('closeDetailBtn')?.focus(); }
  else if(a==='closeDetail'){ ui.detail=null; render(); }
  else if(a==='goPlan'){ ui.view='plan'; ui.detail=null; render(); window.scrollTo(0,0); }
  else if(a==='goSummary'){ ui.view='summary'; render(); window.scrollTo(0,0); }
  else if(a==='adjust'){ ui.planWeek=+t.dataset.week; ui.store=t.dataset.store; ui.detail=null; ui.view='editor'; ui.changed=new Set(); ui.notes=null; ui.confirmDel=null; render(); window.scrollTo(0,0); }
  else if(a==='openStore'){ ev.stopPropagation(); ui.store=t.dataset.store; ui.view='editor'; ui.changed=new Set(); ui.notes=null; ui.confirmDel=null; render(); window.scrollTo(0,0); }
  else if(a==='backPlan'){ ui.view='plan'; ui.store=null; ui.notes=null; render(); window.scrollTo(0,0); }
  else if(a==='askWeek'){ ui.confirmWeek={type:t.dataset.type,w:ui.sumWeek}; render(); document.getElementById('weekYes')?.focus(); }
  else if(a==='weekNo'){ ui.confirmWeek=null; render(); }
  else if(a==='weekYes'){ const c=ui.confirmWeek; ui.confirmWeek=null; if(c) (c.type==='reset'?resetWeek:clearWeek)(c.w); }
  else if(a==='export'){ exportWeek(+t.dataset.week); }
  else if(a==='del'){ ui.confirmDel=t.dataset.pid; render(); }
  else if(a==='delNo'){ ui.confirmDel=null; render(); }
  else if(a==='delYes'){ const d=ensureDraft(); d.people=d.people.filter(p=>p.id!==t.dataset.pid); ui.confirmDel=null; render(); toast('Persona quitada. Presiona “Actualizar horario” para guardar.'); }
  else if(a==='update'){ doUpdate(); }
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&ui.detail){ ui.detail=null; render(); } });
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='sumWeek'){ ui.sumWeek=+el.value; render(); return; }
  if(el.id==='planWeek'){ ui.planWeek=+el.value; render(); return; }
  const f=el.dataset.f; if(!f) return;
  const d=ensureDraft(); const p=d.people.find(x=>x.id===el.dataset.pid); if(!p) return;
  if(f==='day'){ const i=+el.dataset.i; let v=el.value;
    if(v==='__otro'){ const td=el.closest('td'); td.innerHTML=`<input type="text" class="cell" id="c-${p.id}-${i}" placeholder="07 - 15" aria-label="Horario personalizado">`;
      const inp=td.querySelector('input'); inp.focus();
      const commit=()=>{ const nv=norm(inp.value); if(nv && (isWork(nv)||nv.length<=14)){ p.days[i]=nv; if(!p.manual.includes(i)) p.manual.push(i); } render(); };
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } if(e.key==='Escape'){ inp.value=''; inp.blur(); } });
      inp.addEventListener('blur',commit,{once:true}); return; }
    p.days[i]=v; p.manual=p.manual||[]; if(!p.manual.includes(i)) p.manual.push(i); ui.changed.delete(p.id+':'+i); render(); return; }
  if(f==='name'||f==='tipo'){ p[f]=el.value.trim(); renderEditorStatus(); return; }
  p[f]=el.value; render();
});
document.addEventListener('submit',ev=>{
  if(ev.target.id!=='addForm') return; ev.preventDefault();
  const name=document.getElementById('addName').value.trim(); if(!name){ document.getElementById('addName').focus(); return; }
  const tipo=document.getElementById('addTipo').value.trim(), desc=document.getElementById('addDesc').value;
  const t=tipo.toUpperCase(); const sh=/PM/.test(t)&&!/AM/.test(t)?'14 - 22':'08 - 16';
  const p={id:newId(),name,rol:document.getElementById('addRol').value,mod:document.getElementById('addMod').value,tipo,descanso:desc,
    days:DAYS.map(d=>d===desc?'DESCANSO':sh),manual:[]};
  ensureDraft().people.push(p); ui.changed=new Set(p.days.map((_,i)=>p.id+':'+i)); render();
  toast(`${name} agregado. Ajusta sus turnos y presiona “Actualizar horario”.`);
});

async function doUpdate(){
  const d=ensureDraft(); const res=applyRules(d.people);
  ui.changed=res.changed; ui.notes=res.notes;
  const ok=await persist(ui.planWeek,ui.store,d.people);
  delete drafts[key(ui.planWeek,ui.store)];
  render();
  toast(`${ui.store}: horario de la S${ui.planWeek} actualizado y marcado como Planificado${res.changed.size?` · ${res.changed.size} celdas ajustadas`:''}.`);
}

/* ---------- resetear / eliminar semana ---------- */
function weekConfirm(w){ const c=ui.confirmWeek; if(!c||c.w!==w) return '';
  const src=Math.max(40,...STORES.map(s=>prevSource(w,s).m));
  const msg=c.type==='reset'?`¿Resetear la S${w}? Las ${STORES.length} tiendas se reemplazan con una copia de los horarios de la S${src} y quedan en “Por revisar”. Se pierden los cambios guardados de esta semana.`
    :`¿Eliminar la S${w}? Se borran los horarios de las ${STORES.length} tiendas y la semana queda vacía. Puedes recuperarla después con “Resetear semana”.`;
  return `<div class="confirmbar ${c.type}" role="alertdialog" aria-label="Confirmar"><span>${msg}</span><div class="actions"><button class="btn ${c.type==='clear'?'dangerfill':'primary'}" id="weekYes" data-act="weekYes">${c.type==='reset'?'Sí, resetear':'Sí, eliminar'}</button><button class="btn" data-act="weekNo">Cancelar</button></div></div>`; }
async function writeWeek(w,makeBody){ const now=new Date().toISOString();
  const bodies=STORES.map(s=>({week:w, store:s, updatedAt:now, ...makeBody(s)}));
  STORES.forEach(s=>delete drafts[key(w,s)]);
  bodies.forEach(b=>plans[key(w,b.store)]=b); render();
  const res=await Promise.all(bodies.map(b=>persistBody(b))); render(); return res.every(Boolean); }
async function resetWeek(w){ const src={}; STORES.forEach(s=>src[s]=prevSource(w,s));
  const ok=await writeWeek(w,s=>({status:'revisar', people:carry(src[s].e.people), reset:true}));
  if(ok) toast(`S${w} reseteada: copia de la semana anterior, ${STORES.length} tiendas en “Por revisar”.`); }
async function clearWeek(w){ const ok=await writeWeek(w,()=>({status:'revisar', people:[], cleared:true}));
  if(ok) toast(`S${w} eliminada. La semana quedó sin horarios.`); }

/* ---------- exportar ---------- */
async function exportWeek(w){
  if(!window.XLSX){ toast('No se pudo cargar el generador de Excel. Recarga la página e inténtalo de nuevo.'); return; }
  if(!downloads){ toast('La descarga de archivos no está disponible en esta vista. Abre el artifact en claude.ai.'); return; }
  const head=['SEMANA','TIPO / RESTRICCION','TIENDA','ZUBALERO','ROL','MODALIDAD','Dia descanso',...DAYS,'HORAS','ESTADO'];
  const rows=[head];
  STORES.forEach(s=>{ const e=effective(w,s); const st=(e.status==='planificado'||e.status==='excel')?'Planificado':'Por revisar';
    e.people.forEach(p=>rows.push([w,p.tipo||'',s,p.name,p.rol,p.mod,p.descanso||'',...p.days,hoursOf(p),st])); });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[6,18,30,36,13,11,13,10,10,10,10,10,10,10,7,12].map(wch=>({wch}));
  ws['!autofilter']={ref:`A1:P${rows.length}`};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'S'+w);
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  try{ await downloads.save({filename:`Horarios PeYA S${w}.xlsx`, data:new Blob([out])}); toast(`Excel de la S${w} listo: ${rows.length-1} filas, ${STORES.length} tiendas.`); }
  catch(e){ if(e?.code==='declined') return; toast(e?.code==='rate_limited'?'Ya hay una descarga pendiente de confirmar.':'No se pudo descargar el archivo en esta vista.'); }
}

render(); boot();
</script>
